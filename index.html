<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Website publik HMJ Kedokteran Fakultas Kedokteran dan Ilmu Kesehatan UIN Alauddin Makassar." />
    <title>HMJ Kedokteran UIN Alauddin Makassar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,700;0,800;1,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="#beranda" aria-label="Kembali ke beranda">
        <img id="header-logo" class="brand-logo" alt="" />
        <span id="header-name"></span>
      </a>
      <button class="menu-toggle" type="button" aria-controls="site-nav" aria-expanded="false">Menu <span aria-hidden="true">☰</span></button>
      <nav id="site-nav" class="site-nav" aria-label="Navigasi utama"></nav>
    </header>
    <main id="app"></main>
    <footer class="site-footer">
      <div class="footer-brand"><img id="footer-logo" class="brand-logo" alt="" /><span id="footer-name"></span></div>
      <p>© <span id="year"></span> <span id="footer-org-name"></span></p>
      <div id="footer-socials" class="social-links"></div>
    </footer>

    <template id="home-template">
      <section id="beranda" class="hero shell">
        <div class="hero-copy"><p class="eyebrow" id="hero-cabinet"></p><h1 id="hero-name"></h1><p id="hero-jargon" class="hero-jargon"></p><div class="hero-actions"><a class="button" href="#profil">Kenali kami <span aria-hidden="true">↗</span></a><a class="text-link" href="#kalender">Lihat kalender kegiatan</a></div></div>
        <div class="hero-identity"><div class="hero-disc"></div><img id="hero-logo" class="hero-logo" alt="" /><p id="hero-short-name"></p></div>
      </section>
      <section id="profil" class="section shell profile-section"><div class="section-heading"><p class="eyebrow">01 — PROFIL ORGANISASI</p><h2 id="profile-title"></h2></div><div id="profile-content" class="profile-content"></div></section>
      <section id="visi-misi" class="section shell vision-section"><div class="section-heading"><p class="eyebrow">02 — ARAH GERAK</p><h2>Bersama dalam hangat,<br /><em>bertumbuh dalam karya.</em></h2></div><div class="vision-grid"><article class="vision-card"><span>VISI</span><p id="vision"></p></article><article class="mission-card"><span>MISI</span><ol id="missions"></ol></article></div></section>
      <section id="pengurus" class="section shell"><div class="section-heading with-copy"><div><p class="eyebrow">03 — PENGURUS INTI</p><h2>Orang-orang di balik<br /><em>gerak kami.</em></h2></div><p id="core-board-caption"></p></div><div id="leaders" class="leaders"></div></section>
      <section id="departemen" class="section shell departments-section"><div class="section-heading with-copy"><div><p class="eyebrow">04 — DEPARTEMEN</p><h2>Satu rumah,<br /><em>sepuluh ruang.</em></h2></div><p>Jelajahi kepengurusan, program kerja, dokumentasi, serta kanal informasi setiap departemen.</p></div><div id="department-list" class="department-list"></div></section>
      <section id="program" class="section program-section"><div class="shell"><div class="section-heading with-copy"><div><p class="eyebrow">05 — PROGRAM KERJA</p><h2>Rencana yang hadir<br /><em>menjadi karya.</em></h2></div><p>Seluruh agenda Kabinet Simfoni dihimpun dalam satu sumber data yang mudah diperbarui pengurus.</p></div><div id="program-list" class="program-list"></div></div></section>
      <section id="kalender" class="section shell"><div class="section-heading with-copy"><div><p class="eyebrow">06 — KALENDER KEGIATAN</p><h2>Tandai waktunya,<br /><em>hadiri geraknya.</em></h2></div><p>Kalender ini dibuat otomatis dari tanggal kegiatan yang dipublikasikan.</p></div><div id="calendar" class="calendar"></div></section>
      <section id="dokumentasi" class="section documentation-section"><div class="shell"><div class="section-heading with-copy"><div><p class="eyebrow">07 — DOKUMENTASI</p><h2>Jejak hangat<br /><em>setiap perjumpaan.</em></h2></div><p>Arsip visual akan muncul di sini setelah dokumentasi resmi ditambahkan oleh pengurus.</p></div><div id="documentation-list" class="documentation-grid"></div></div></section>
      <section id="kontak" class="section shell contact-section"><div><p class="eyebrow">08 — KONTAK &amp; MEDIA SOSIAL</p><h2>Mari terhubung<br /><em>dan berkolaborasi.</em></h2></div><div id="contact-content" class="contact-content"></div></section>
    </template>

    <template id="department-template">
      <section class="department-hero shell"><a class="back-link" href="#departemen">← Kembali ke departemen</a><p id="department-number" class="room-number"></p><div class="department-title"><img id="department-logo" class="department-logo" alt="" /><div><p id="department-eyebrow" class="eyebrow"></p><h1 id="department-name"></h1><p id="department-description" class="intro"></p><div id="department-socials" class="social-links"></div></div></div></section>
      <section class="section shell"><div class="section-heading"><p class="eyebrow">PENGURUS DEPARTEMEN</p><h2 id="department-team-heading">Ruang tumbuh<br /><em>bersama.</em></h2></div><div id="team-list" class="team-list"></div></section>
      <section class="section program-section"><div class="shell"><div class="section-heading"><p class="eyebrow">PROGRAM KERJA</p><h2>Agenda dan<br /><em>rencana kerja.</em></h2></div><div id="department-programs" class="program-list"></div></div></section>
      <section class="section shell"><div class="section-heading"><p class="eyebrow">DOKUMENTASI</p><h2>Jejak karya<br /><em>kami.</em></h2></div><div id="department-documentation" class="documentation-grid"></div></section>
    </template>

    <script src="org-data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
